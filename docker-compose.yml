services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: crewlink
      POSTGRES_USER: crewlink
      POSTGRES_PASSWORD: crewlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewlink -d crewlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./django-member-callout
    env_file:
      - ./django-member-callout/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate --noinput
    restart: "no"

  seed:
    build:
      context: ./django-member-callout
    env_file:
      - ./django-member-callout/.env
    environment:
      DB_HOST: db
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python manage.py seed_demo
    restart: "no"

  api:
    build:
      context: ./django-member-callout
    env_file:
      - ./django-member-callout/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./django-member-callout
    env_file:
      - ./django-member-callout/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command: celery -A member_callout_exercise worker --loglevel=info
    restart: unless-stopped

  beat:
    build:
      context: ./django-member-callout
    env_file:
      - ./django-member-callout/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command: celery -A member_callout_exercise beat --loglevel=info
    restart: unless-stopped

volumes:
  pgdata:
